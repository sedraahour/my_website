<!-- ===== Header: الشعار واسم الدليل + شريط التنقل Navbar ===== -->
<header>
<nav class="navbar navbar-expand-lg navbar-dark navbar-main">
<div class="container">
<a class="navbar-brand" href="index.html"><img src="assets/img/logo.svg" width="36" height="36" alt="شعار الدليل" /> دليل فعاليات الجامعة</a>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
<li class="nav-item"><a class="nav-link" href="events.html">كل الفعاليات</a></li>
<li class="nav-item"><a class="nav-link active" href="event.html">تفاصيل الفعالية</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">اتصل بنا</a></li>
</ul>
<input type="button" id="darkBtn" class="btn btn-sm btn-outline-light" value="وضع داكن / فاتح" />
</div>
</div>
</nav>
</header>

<!-- ===== Main: محتوى الصفحة ===== -->
<main class="flex-grow-1">

<!-- القسم 1: تفاصيل الفعالية (العنوان والتاريخ والمكان والوصف والخريطة تُبنى في main.js حسب ?id=) -->
<div class="container mt-4">
<div id="detail"></div>
<div class="mb-3">
<a id="calBtn" class="btn btn-primary" href="#" target="_blank">أضف للتقويم</a>
<input type="button" id="shareBtn" class="btn btn-outline-primary" value="شارك" />
<input type="button" id="openBook" class="btn btn-warning" value="احجز مكانًا" data-bs-toggle="modal" data-bs-target="#bookModal" />
</div>
<div id="msg"></div>
</div>

<!-- القسم 2: معرض صور صغير -->
<div class="container mt-3">
<h2 class="sec h4">معرض الصور</h2>
<div class="gallery">
<img src="assets/img/g1.svg" alt="صورة 1" class="rounded" />
<img src="assets/img/g2.svg" alt="صورة 2" class="rounded" />
<img src="assets/img/g3.svg" alt="صورة 3" class="rounded" />
</div>
</div>

<!-- القسم 3: فعاليات ذات صلة -->
<div class="container mt-4">
<h2 class="sec h4">فعاليات ذات صلة</h2>
<div class="row" id="related"></div>
</div>

<!-- نافذة الحجز الوهمي (Bootstrap Modal) -->
<div class="modal fade" id="bookModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">حجز مكان</h5>
<button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<label for="bname" class="form-label">الاسم</label>
<input type="text" id="bname" class="form-control" />
<div id="bmsg" class="mt-2"></div>
</div>
<div class="modal-footer">
<input type="button" id="bookBtn" class="btn btn-primary" value="تأكيد الحجز" />
</div>
</div>
</div>
</div>
</main>

<!-- ===== Footer: معلومات التواصل وحقوق النشر وروابط السوشيال ===== -->

</div>

</div>
